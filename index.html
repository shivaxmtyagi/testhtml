<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <style>
        /* Base reset and styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            padding: 20px;
        }

        /* Container */
        .auth-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            transition: height 0.3s ease;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333333;
        }

        /* Form Group Styling */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555555;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #007BFF;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        /* Divider styling */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #777777;
            font-size: 14px;
        }

        .divider::before, 
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #cccccc;
        }

        .divider:not(:empty)::before {
            margin-right: 10px;
        }

        .divider:not(:empty)::after {
            margin-left: 10px;
        }

        /* Social Login Buttons */
        .social-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .social-btn:hover {
            background-color: #f8f9fa;
            border-color: #aaaaaa;
        }

        .social-btn:last-of-type {
            margin-bottom: 0;
        }

        /* Helper Text */
        .helper-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #777777;
        }

        .helper-text a {
            color: #007BFF;
            text-decoration: none;
            cursor: pointer;
        }

        .helper-text a:hover {
            text-decoration: underline;
        }

        /* Utility class to hide forms */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div id="login-section">
            <h2>Welcome Back</h2>
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="login-username">Username or Email</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username" required>
                </div>
                
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            
            <div class="helper-text">
                <p>Don't have an account? <a onclick="toggleAuth()">Sign up here</a></p>
            </div>
        </div>

        <div id="signup-section" class="hidden">
            <h2>Create an Account</h2>
            <form action="#" method="POST">
                
                <div class="input-group">
                    <label for="signup-fullname">Full Name</label>
                    <input type="text" id="signup-fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="Create a strong password" required>
                </div>
                
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <div class="divider">OR</div>

            <button class="social-btn" type="button">Continue with Google</button>
            <button class="social-btn" type="button">Continue with Microsoft</button>
            
            <div class="helper-text">
                <p>Already have an account? <a onclick="toggleAuth()">Sign in here</a></p>
            </div>
        </div>

    </div>

    <script>
        function toggleAuth() {
            const loginSection = document.getElementById('login-section');
            const signupSection = document.getElementById('signup-section');

            // Toggle the 'hidden' class on both sections
            loginSection.classList.toggle('hidden');
            signupSection.classList.toggle('hidden');
        }
    </script>

</body>
</html>
